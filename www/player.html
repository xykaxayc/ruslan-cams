<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камера</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
  video-stream { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="module" src="./video-stream.js?v=7"></script>
<script type="module">
  const params = new URLSearchParams(location.search);
  const name = params.get('src');
  const port = params.get('go2rtc') || '1984';
  const buffer = parseFloat(params.get('buffer') ?? '1.0');
  const video = document.createElement('video-stream');
  video.mode = 'mse';
  video.background = true;
  video.bufferSeconds = isNaN(buffer) ? 1.0 : buffer;
  const isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  const wsHost = isLocal ? (location.hostname + ':' + port) : location.host;
  video.src = location.protocol + '//' + wsHost + '/api/ws?src=' + encodeURIComponent(name);
  document.body.appendChild(video);
  document.title = name + ' - Камера';
</script>
</body>
</html>
